[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "orchid-oe"
version = "0.4.0"
description = "ORCHID: multiscale charge & exciton transport simulator for organic semiconductors, OLEDs and organic solar cells (KMC, master equation, EGDM, drift-diffusion, transfer-matrix optics)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Gokaran Shukla", email = "gokaran.shukla@kaust.edu.sa"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.9", "numba>=0.57", "pyyaml>=5"]
keywords = ["organic semiconductors", "OLED", "organic photovoltaics", "kinetic Monte Carlo",
            "master equation", "Gaussian disorder model", "drift-diffusion", "hopping transport"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License",
               "Topic :: Scientific/Engineering :: Physics"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
mpi = ["mpi4py>=3.1"]
amg = ["pyamg>=5"]
gpu = ["cupy-cuda12x>=13"]
validate = ["matplotlib>=3.5", "tmm>=0.2"]
qc = ["pyscf>=2.3"]
all = ["matplotlib>=3.5", "mpi4py>=3.1", "pyamg>=5", "tmm>=0.2", "pyscf>=2.3"]
dev = ["pytest>=7", "matplotlib>=3.5", "pyamg>=5", "tmm>=0.2", "pyscf>=2.3"]

[project.scripts]
orchid = "orchid.cli:main"

[project.urls]
Homepage = "https://github.com/Gokaran-Shukla/orchid"

[tool.setuptools.packages.find]
include = ["orchid*"]

[tool.setuptools.package-data]
orchid = ["data/*.csv", "data/*.json", "data/nk/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
